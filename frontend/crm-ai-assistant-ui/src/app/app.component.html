<div class="app">
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">
        <img src="assets/we-logo.png" alt="WE" width="48" height="48" />
      </div>
      <div class="brand-text">
        <h1>WE CRM AI Assistant</h1>
        <p>AI-Powered CRM Intelligence Assistant</p>
      </div>
    </div>
    <div class="header-actions">
      <button
        type="button"
        class="theme-toggle"
        [attr.aria-label]="themeAriaLabel"
        [title]="themeAriaLabel"
        (click)="toggleTheme()"
      >
        <span class="theme-icon" aria-hidden="true"></span>
        <span>{{ themeToggleLabel }}</span>
      </button>
    </div>
  </header>
  <div class="workspace">
    <router-outlet />
  </div>
</div>
