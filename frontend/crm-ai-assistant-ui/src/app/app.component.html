<div class="app">
  <header class="page-header">
    <div class="page-header-row">
      <div class="page-header-main">
        <span class="page-header-icon" aria-hidden="true" title="AI Assistant">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Sparkle / AI mark -->
            <path
              d="M10 2.2 11.15 7.1 16 8.25 11.15 9.4 10 14.3 8.85 9.4 4 8.25 8.85 7.1Z"
              stroke="currentColor"
              stroke-width="1.25"
              stroke-linejoin="round"
            />
            <path
              d="M15.2 12.2 15.75 14.4 18 14.95 15.75 15.5 15.2 17.7 14.65 15.5 12.4 14.95 14.65 14.4Z"
              stroke="currentColor"
              stroke-width="1.15"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <div class="page-header-text">
          <h1 class="page-title">WE AI Assistant</h1>
          <p class="page-header-meta">Ask about accounts, contacts, leads, and sales orders</p>
        </div>
      </div>
      <button type="button" class="new-chat-btn" (click)="onNewChat()" title="Start a new chat">
        New chat
      </button>
    </div>
  </header>

  <div class="workspace">
    <router-outlet />
  </div>
</div>
