<div class="composer">
  <form (ngSubmit)="onSubmit()">
    <input
      type="text"
      name="message"
      [(ngModel)]="message"
      [disabled]="disabled"
      [class.rtl]="inputRtl"
      [attr.dir]="inputRtl ? 'rtl' : 'ltr'"
      placeholder="Ask about sales orders, accounts, contacts, leads..."
      autocomplete="off"
      required
    />
    <button class="send" type="submit" [disabled]="disabled || !message.trim()">
      Send
    </button>
  </form>
  <div class="hints">
    Try: <code>Show me the latest 5 accounts</code> ·
    <code>هاتلي آخر 5 Sales Orders</code> ·
    <code>Delete all accounts</code>
    <code>Highest-value sales orders</code>
  </div>
</div>
