<div class="composer" [class.composer-welcome]="variant === 'welcome'">
  <form (ngSubmit)="onSubmit()">
    <textarea
      name="message"
      rows="1"
      [(ngModel)]="message"
      dir="ltr"
      [placeholder]="placeholder"
      autocomplete="off"
      aria-label="Message"
      (keydown.enter)="onEnterKey($event)"
    ></textarea>
    <button
      class="send"
      type="submit"
      [class.is-cooldown]="cooldownSeconds > 0"
      [disabled]="!canSend"
      [attr.aria-label]="buttonLabel"
      [attr.title]="
        cooldownSeconds > 0
          ? 'Please wait ' + cooldownSeconds + 's before sending again'
          : loading
            ? 'Waiting for the answer…'
            : 'Send'
      "
    >
      @if (cooldownSeconds > 0) {
        <span>{{ cooldownSeconds }}s</span>
      } @else {
        <svg class="send-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.5 8h11M9 3.5 13.5 8 9 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Send</span>
      }
    </button>
  </form>
  @if (showHints) {
    <div class="hints">
      Read-only CRM queries: list, count, and grouped reports for accounts, contacts, leads, and sales orders.
    </div>
  }
</div>
