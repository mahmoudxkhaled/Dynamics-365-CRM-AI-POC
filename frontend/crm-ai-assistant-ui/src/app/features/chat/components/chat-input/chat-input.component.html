<div class="composer">
  <form (ngSubmit)="onSubmit()">
    <input
      type="text"
      name="message"
      [(ngModel)]="message"
      [disabled]="disabled"
      dir="ltr"
      placeholder="Ask about sales orders, accounts, contacts, leads..."
      autocomplete="off"
      required
    />
    <button class="send" type="submit" [disabled]="disabled || !message.trim()">
      Send
    </button>
  </form>
  <div class="hints">
    Supported: list, count, and grouped reports (status / monthly / totals). Read-only CRM queries only.
  </div>
</div>
