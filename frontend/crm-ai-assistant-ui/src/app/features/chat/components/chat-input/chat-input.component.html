<div class="composer">
  <form (ngSubmit)="onSubmit()">
    <input
      type="text"
      name="message"
      [(ngModel)]="message"
      [disabled]="disabled"
      [class.rtl]="inputRtl"
      [attr.dir]="inputRtl ? 'rtl' : 'ltr'"
      placeholder="Ask about sales orders, accounts, contacts, leads..."
      autocomplete="off"
      required
    />
    <button class="send" type="submit" [disabled]="disabled || !message.trim()">
      Send
    </button>
  </form>
  <div class="hints">
    Try:
    @for (sample of samples; track sample; let last = $last) {
      <button
        type="button"
        class="hint-sample"
        [class.copied]="copiedSample === sample"
        [title]="copiedSample === sample ? 'Copied!' : 'Click to copy'"
        (click)="useSample(sample, $event)"
      >
        {{ sample }}
      </button>
      @if (!last) {
        <span aria-hidden="true"> · </span>
      }
    }
  </div>
</div>
