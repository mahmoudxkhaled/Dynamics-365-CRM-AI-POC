<section class="panel chat-panel">
  <div class="chat" #chatScroll>
    @for (msg of messages; track trackById($index, msg)) {
      <app-chat-message
        [message]="msg"
        [suggestionsDisabled]="inputBlocked"
        (suggestionSelected)="onClarificationSuggestion($event)"
      />
    }

    @if (loading) {
      <div class="msg assistant typing" role="status" aria-live="polite" aria-label="Assistant is typing">
        <span class="typing-dot" aria-hidden="true"></span>
        <span class="typing-dot" aria-hidden="true"></span>
        <span class="typing-dot" aria-hidden="true"></span>
      </div>
    }

    @if (showSuggestions) {
      <div class="suggestions">
        <p class="suggestions-title">Suggested questions</p>
        <div class="suggestions-grid">
          @for (q of suggestedQuestions; track q) {
            <button
              type="button"
              class="suggestion-chip"
              [disabled]="inputBlocked"
              (click)="onSuggestion(q)"
            >
              {{ q }}
            </button>
          }
        </div>
      </div>
    }
  </div>
  <app-chat-input
    [loading]="loading"
    [cooldownSeconds]="cooldownRemainingSeconds"
    (send)="onSend($event)"
  />
</section>
