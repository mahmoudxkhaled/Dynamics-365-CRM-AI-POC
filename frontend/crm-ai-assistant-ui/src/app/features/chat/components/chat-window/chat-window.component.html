<section class="panel chat-panel">
  <div class="panel-head">
    <h2>AI Chat</h2>
  </div>
  <div class="chat" #chatScroll>
    @for (msg of messages; track trackById($index, msg)) {
      <app-chat-message [message]="msg" />
    }

    @if (showSuggestions) {
      <div class="suggestions">
        <p class="suggestions-title">Try a suggested question</p>
        <div class="suggestions-grid">
          @for (q of suggestedQuestions; track q) {
            <button
              type="button"
              class="suggestion-chip"
              [disabled]="loading"
              (click)="onSuggestion(q)"
            >
              {{ q }}
            </button>
          }
        </div>
      </div>
    }
  </div>
  <app-chat-input [disabled]="loading" (send)="onSend($event)" />
</section>
