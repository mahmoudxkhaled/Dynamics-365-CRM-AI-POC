<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WE CRM AI Assistant</title>
  <script>
    // Apply theme before paint to avoid flash.
    (function () {
      try {
        var saved = localStorage.getItem("we-crm-theme");
        var theme = saved === "light" || saved === "dark"
          ? saved
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <style>
    /* —— WE Telecom Egypt design tokens (POC; not official brand guidelines) —— */
    :root {
      --we-purple: #5B2C91;
      --we-purple-hover: #482271;
      --we-purple-soft: #F6F3FA;
      --we-purple-muted: #EDE7F4;
      --we-purple-tint: #D4C4E8;
      --we-white: #FFFFFF;
      --we-on-accent: #FFFFFF;
      --we-text: #272333;
      --we-text-secondary: #6B6875;
      --we-border: #E7E2ED;
      --we-surface: #FFFFFF;
      --we-surface-elevated: #FFFFFF;
      --we-page-bg: #F6F3FA;
      --we-page-bg-accent: #EFEAF6;
      --we-shadow-sm: 0 1px 2px rgba(39, 35, 51, 0.06);
      --we-shadow-md: 0 4px 16px rgba(39, 35, 51, 0.08);
      --we-radius: 12px;
      --we-radius-sm: 8px;
      --we-radius-lg: 16px;
      --we-font: "Segoe UI", "Noto Sans Arabic", Tahoma, sans-serif;
      --we-mono: Consolas, "Cascadia Mono", "Courier New", monospace;
      --placeholder: #9A96A4;
      --panel-head-bg: linear-gradient(180deg, var(--we-white) 0%, var(--we-purple-soft) 160%);
      --table-head-bg: var(--we-purple);
      --page-glow-a: rgba(91, 44, 145, 0.08);
      --page-glow-b: rgba(91, 44, 145, 0.05);

      --bg: var(--we-page-bg);
      --panel: var(--we-surface);
      --text: var(--we-text);
      --muted: var(--we-text-secondary);
      --accent: var(--we-purple);
      --accent-hover: var(--we-purple-hover);
      --accent-soft: var(--we-purple-soft);
      --accent-muted: var(--we-purple-muted);
      --user: #EFE8F7;
      --user-border: #D4C4E8;
      --bot: var(--we-white);
      --bot-border: var(--we-border);
      --border: var(--we-border);
      --row-alt: #FAF8FC;
      --row-hover: #F3EEF8;
      --head: var(--we-purple-soft);
      --fail: #B91C1C;
      --fail-bg: #FEF2F2;
      --fail-border: #FECACA;
      --focus-ring: 0 0 0 3px rgba(91, 44, 145, 0.28);
    }

    html[data-theme="dark"] {
      --we-purple: #9B6DD4;
      --we-purple-hover: #B48AE0;
      --we-purple-soft: #2E2440;
      --we-purple-muted: #352A4A;
      --we-purple-tint: #5B4578;
      --we-white: #241E30;
      --we-on-accent: #FFFFFF;
      --we-text: #F0ECF5;
      --we-text-secondary: #A8A3B3;
      --we-border: #3A3348;
      --we-surface: #241E30;
      --we-surface-elevated: #2A2438;
      --we-page-bg: #1A1623;
      --we-page-bg-accent: #221C2E;
      --we-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
      --we-shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
      --placeholder: #7A7585;
      --panel-head-bg: linear-gradient(180deg, #2E2440 0%, var(--we-surface) 160%);
      --table-head-bg: #4A2478;
      --page-glow-a: rgba(91, 44, 145, 0.22);
      --page-glow-b: rgba(91, 44, 145, 0.12);
      --user: #352A4A;
      --user-border: #5B4578;
      --bot: #2A2438;
      --bot-border: #3A3348;
      --row-alt: #2A2438;
      --row-hover: #322B42;
      --fail: #FECACA;
      --fail-bg: #450A0A;
      --fail-border: #991B1B;
      --focus-ring: 0 0 0 3px rgba(155, 109, 212, 0.35);
      --accent: var(--we-purple);
      --accent-hover: var(--we-purple-hover);
      --accent-soft: var(--we-purple-soft);
      --accent-muted: var(--we-purple-muted);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--we-font);
      background:
        radial-gradient(ellipse 80% 50% at 0% -10%, var(--page-glow-a), transparent 50%),
        radial-gradient(ellipse 60% 40% at 100% 0%, var(--page-glow-b), transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
      color-scheme: light;
    }
    html[data-theme="dark"] body { color-scheme: dark; }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: calc(100vh - 32px);
    }

    /* —— Application header —— */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      background: var(--we-white);
      border: 1px solid var(--border);
      border-radius: var(--we-radius-lg);
      box-shadow: var(--we-shadow-sm);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .brand-mark {
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(91, 44, 145, 0.35);
      background: var(--we-purple);
    }
    .brand-mark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--we-surface);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    .theme-toggle:hover {
      border-color: var(--we-purple-tint);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .theme-toggle:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }
    .theme-toggle .theme-icon {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: inset 0 0 0 2px var(--we-on-accent);
    }
    html[data-theme="dark"] .theme-toggle .theme-icon {
      background: #F5E9A8;
      box-shadow: none;
    }
    .brand-text { min-width: 0; }
    .brand-text h1 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--we-text);
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .brand-text p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.35;
    }

    .workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--we-radius-lg);
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--we-shadow-sm);
      flex: 1;
    }

    .panel-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--panel-head-bg);
    }
    .panel-head h2 {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--we-purple);
      letter-spacing: 0.01em;
    }
    .panel-head-meta {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 500;
      margin-left: 8px;
    }

    /* —— Chat —— */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--we-page-bg);
      position: relative;
    }
    .chat:empty::before,
    .chat-empty {
      margin: auto;
      max-width: 360px;
      text-align: center;
      color: var(--muted);
      padding: 24px 16px;
    }
    .chat-empty-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 14px;
      background: var(--accent-muted);
      color: var(--we-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 800;
    }
    .chat-empty strong {
      display: block;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 6px;
    }
    .chat-empty p {
      margin: 0;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .msg {
      max-width: 92%;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.5;
      border: 1px solid var(--border);
      font-size: 0.95rem;
    }
    .msg.plain { white-space: pre-wrap; }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      border-color: var(--user-border);
      color: var(--text);
      white-space: pre-wrap;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--bot);
      border-color: var(--bot-border);
      max-width: 100%;
      width: min(100%, 1100px);
      border-bottom-left-radius: 4px;
      box-shadow: var(--we-shadow-sm);
    }
    .msg.assistant.has-table { width: min(100%, 100%); max-width: 100%; }
    .msg.meta {
      align-self: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      background: transparent;
      font-size: 0.8rem;
      white-space: pre-wrap;
      padding: 8px 14px;
      border-radius: 999px;
      max-width: 95%;
    }
    .msg.error,
    .msg.assistant.plain.error {
      border-color: var(--fail-border);
      background: var(--fail-bg);
      color: var(--fail);
    }
    .msg.rtl { direction: rtl; text-align: right; }
    .msg-summary { margin: 0 0 10px; white-space: pre-wrap; color: var(--text); }
    .msg-meta-lines {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.85rem;
      white-space: pre-wrap;
    }

    /* —— Dynamic CRM tables —— */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      border-radius: var(--we-radius-sm);
      background: var(--we-white);
      direction: ltr;
      text-align: left;
      max-width: 100%;
    }
    table.crm-table {
      width: max-content;
      min-width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: auto;
      font-size: 0.88rem;
    }
    table.crm-table th,
    table.crm-table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
      direction: ltr;
      unicode-bidi: isolate;
    }
    table.crm-table th {
      background: var(--table-head-bg);
      color: var(--we-on-accent);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 1;
      letter-spacing: 0.01em;
    }
    table.crm-table th:first-child { border-top-left-radius: 7px; }
    table.crm-table th:last-child { border-top-right-radius: 7px; }
    table.crm-table tbody tr:nth-child(even) { background: var(--row-alt); }
    table.crm-table tbody tr:hover { background: var(--row-hover); }
    table.crm-table tbody tr:last-child td { border-bottom: none; }
    table.crm-table th.col-text,
    table.crm-table td.col-text {
      white-space: normal;
      min-width: 140px;
      max-width: 280px;
      overflow-wrap: break-word;
      word-break: normal;
    }
    table.crm-table th.col-num,
    table.crm-table td.col-num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    table.crm-table th.col-empty,
    table.crm-table td.col-empty {
      color: var(--muted);
      min-width: 72px;
    }
    .table-empty {
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .count-badge {
      display: inline-block;
      margin: 4px 0 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--accent-muted);
      color: var(--we-purple);
      border: 1px solid var(--we-purple-tint);
      font-weight: 700;
      font-size: 0.88rem;
    }

    /* —— Composer —— */
    .composer {
      border-top: 1px solid var(--border);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--we-white);
    }
    form { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--we-white);
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      direction: ltr;
      text-align: left;
      unicode-bidi: plaintext;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: var(--focus-ring);
    }
    input[type="text"].rtl { direction: rtl; text-align: right; }
    input[type="text"]::placeholder { color: var(--placeholder); }
    button.send {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: var(--we-on-accent);
      font-weight: 700;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      min-width: 88px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    button.send:hover:not(:disabled) { background: var(--accent-hover); }
    button.send:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }
    button.send:disabled {
      opacity: 0.7;
      cursor: wait;
      position: relative;
    }
    button.send:disabled::after {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-left: 6px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: var(--we-on-accent);
      border-radius: 50%;
      vertical-align: -1px;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hints { color: var(--muted); font-size: 0.8rem; line-height: 1.45; }
    .hints code {
      color: var(--we-purple);
      background: var(--accent-soft);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-family: var(--we-mono);
    }

    @media (max-width: 900px) {
      body { padding: 10px; }
      .app { height: auto; min-height: calc(100vh - 20px); gap: 10px; }
      .app-header { padding: 12px 14px; }
      .brand-mark { width: 42px; height: 42px; }
      .brand-text h1 { font-size: 1.05rem; }
      .workspace { min-height: 70vh; }
      .chat-panel { min-height: 65vh; }
    }

    @media (max-width: 480px) {
      .brand-text p { display: none; }
      form { flex-direction: column; }
      button.send { width: 100%; }
    }

  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">
          <img src="/assets/we-logo.png" alt="WE" width="48" height="48" />
        </div>
        <div class="brand-text">
          <h1>WE CRM AI Assistant</h1>
          <p>AI-Powered CRM Intelligence Assistant</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
          <span class="theme-icon" aria-hidden="true"></span>
          <span id="themeToggleLabel">Dark</span>
        </button>
      </div>
    </header>
    <div class="workspace" id="workspace">
      <section class="panel chat-panel">
        <div class="panel-head">
          <h2>AI Chat <span class="panel-head-meta">Ask in Arabic or English</span></h2>
        </div>
        <div class="chat" id="chat"></div>
        <div class="composer">
          <form id="form">
            <input id="message" type="text" placeholder="Ask about sales orders, accounts, contacts, leads..." autocomplete="off" required />
            <button class="send" type="submit" id="send">Send</button>
          </form>
          <div class="hints">
            Try: <code>Show me the latest 5 accounts</code> ·
            <code>هاتلي آخر 5 Sales Orders</code> ·
            <code>Delete all accounts</code>
            <code>Highest-value sales orders</code>
          </div>
        </div>
      </section>
    </div>
  </div>
  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");
    const themeToggle = document.getElementById("themeToggle");
    const themeToggleLabel = document.getElementById("themeToggleLabel");
    const THEME_KEY = "we-crm-theme";

    function currentTheme() {
      return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    }
    function applyTheme(theme) {
      const next = theme === "dark" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem(THEME_KEY, next); } catch { /* ignore */ }
      if (themeToggleLabel) themeToggleLabel.textContent = next === "dark" ? "Light" : "Dark";
      if (themeToggle) {
        themeToggle.setAttribute("aria-label", next === "dark" ? "Switch to light mode" : "Switch to dark mode");
        themeToggle.title = next === "dark" ? "Switch to light mode" : "Switch to dark mode";
      }
    }
    applyTheme(currentTheme());
    if (themeToggle) {
      themeToggle.addEventListener("click", () => {
        applyTheme(currentTheme() === "dark" ? "light" : "dark");
      });
    }

    let conversationId = null;

    const HIDDEN_KEYS = new Set([
      "salesorderid", "accountid", "contactid", "leadid", "@odata.etag", "odata.etag"
    ]);
    const COLUMN_PRIORITY = [
      "name", "fullName", "fullname", "orderNumber", "ordernumber", "accountNumber", "accountnumber",
      "totalAmount", "totalamount", "createdOn", "createdon", "modifiedOn", "modifiedon",
      "stateLabel", "statusLabel", "statecode_label", "statuscode_label", "stateCode", "statusCode", "statecode", "statuscode",
      "emailAddress1", "emailaddress1", "telephone1", "jobTitle", "jobtitle",
      "city", "address1_city", "country", "address1_country",
      "customerAccountId", "_te_customeraccountid_value", "_customerid_value", "_parentcustomerid_value"
    ];

    function hasArabic(text) { return /[\u0600-\u06FF]/.test(text || ""); }
    function syncInputDirection() {
      input.classList.toggle("rtl", hasArabic(input.value));
      input.setAttribute("dir", hasArabic(input.value) ? "rtl" : "ltr");
    }
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    }
    function isGuidLike(value) {
      return typeof value === "string" &&
        /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/.test(value.trim());
    }
    function formatCell(key, value, kind) {
      if (value === null || value === undefined || value === "") return "—";
      const kindNorm = String(kind || "").toLowerCase();
      if (["lookup", "customer", "owner", "uniqueidentifier", "guid"].includes(kindNorm) || isGuidLike(value)) {
        if (isGuidLike(value) || (typeof value === "string" && isGuidLike(String(value)))) return "—";
      }
      if (kindNorm === "money" || (typeof value === "number" && /amount|price|revenue|total/i.test(key || ""))) {
        const n = Number(value);
        if (!Number.isNaN(n)) {
          return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
      }
      if (kindNorm === "datetime" || (typeof value === "string" && /^\d{4}-\d{2}-\d{2}T/.test(value))) {
        try { return new Date(value).toISOString().slice(0, 10); } catch { /* fall through */ }
      }
      if (kindNorm === "boolean") {
        if (value === true || value === "true") return "true";
        if (value === false || value === "false") return "false";
      }
      if (typeof value === "number") return value.toLocaleString();
      return String(value);
    }
    function resolveCellValue(row, column) {
      if (!row || !column) return { value: null, kind: column && column.kind };
      const key = column.key;
      if (Object.prototype.hasOwnProperty.call(row, key) && row[key] != null && row[key] !== "") {
        return { value: row[key], kind: column.kind };
      }
      if (typeof key === "string" && key.endsWith("_label")) {
        const raw = key.slice(0, -"_label".length);
        if (Object.prototype.hasOwnProperty.call(row, raw)) return { value: row[raw], kind: column.kind };
      }
      if (typeof key === "string" && key.endsWith("_formatted")) {
        const raw = key.slice(0, -"_formatted".length);
        if (Object.prototype.hasOwnProperty.call(row, raw)) return { value: row[raw], kind: column.kind };
      }
      if (column.logicalName && Object.prototype.hasOwnProperty.call(row, column.logicalName)) {
        return { value: row[column.logicalName], kind: column.kind };
      }
      return { value: row[key], kind: column.kind };
    }
    function niceHeader(key) {
      const map = {
        name: "Name", fullname: "Full name", fullName: "Full name",
        ordernumber: "Order #", orderNumber: "Order #",
        accountnumber: "Account #", accountNumber: "Account #",
        totalamount: "Amount", totalAmount: "Amount",
        createdon: "Created", createdOn: "Created",
        modifiedon: "Modified", modifiedOn: "Modified",
        statecode_label: "State", statuscode_label: "Status",
        stateLabel: "State", statusLabel: "Status",
        emailaddress1: "Email", emailAddress1: "Email", telephone1: "Phone",
        jobtitle: "Job title", jobTitle: "Job title",
        address1_city: "City", address1_country: "Country"
      };
      return map[key] || key.replace(/^_/, "").replace(/_value$/, "").replace(/_label$/, "").replaceAll("_", " ");
    }
    function extractRows(structured) {
      if (!structured || typeof structured !== "object") return [];
      if (Array.isArray(structured.records)) return structured.records;
      if (Array.isArray(structured.salesOrders)) return structured.salesOrders;
      if (Array.isArray(structured.accounts)) return structured.accounts;
      if (Array.isArray(structured.contacts)) return structured.contacts;
      return [];
    }
    function normalizeMetadataColumns(structured) {
      if (!structured || !Array.isArray(structured.columns) || structured.columns.length === 0) return null;
      return structured.columns
        .filter(c => c && c.key)
        .map(c => ({
          key: String(c.key),
          label: (c.label && String(c.label).trim()) || niceHeader(String(c.key)),
          kind: c.kind ? String(c.kind) : "",
          logicalName: c.logicalName ? String(c.logicalName) : ""
        }));
    }
    function pickColumns(rows) {
      if (!rows.length) return [];
      const keys = new Set();
      rows.forEach(row => Object.keys(row || {}).forEach(k => {
        if (!HIDDEN_KEYS.has(k.toLowerCase()) && !k.startsWith("@") && !k.endsWith("_formatted")) keys.add(k);
      }));
      const preferred = COLUMN_PRIORITY.filter(k => [...keys].some(x => x.toLowerCase() === k));
      const resolvedPreferred = preferred.map(p => [...keys].find(x => x.toLowerCase() === p)).filter(Boolean);
      const rest = [...keys].filter(k => !resolvedPreferred.some(p => p.toLowerCase() === k.toLowerCase()));
      const withoutRawCodes = rest.filter(k => {
        const lower = k.toLowerCase();
        if ((lower === "statecode" || lower === "statuscode") &&
            [...keys].some(p => p.toLowerCase() === lower + "_label")) return false;
        return true;
      });
      return [...resolvedPreferred, ...withoutRawCodes].slice(0, 8).map(k => ({
        key: k,
        label: niceHeader(k),
        kind: "",
        logicalName: k
      }));
    }
    function columnClass(column, sampleText) {
      const kind = String(column.kind || "").toLowerCase();
      const key = `${column.key || ""} ${column.logicalName || ""}`;
      if (["money", "integer", "decimal"].includes(kind)) return "col-num";
      if (["datetime", "boolean", "status", "state", "picklist"].includes(kind)) return "";
      if (/amount|price|revenue|total/i.test(key)) return "col-num";
      if (/name|fullname|email|job|city|country|subject|description/i.test(key) || kind === "string" || kind === "memo") {
        return "col-text";
      }
      if (sampleText === "—" || sampleText === "") return "col-empty";
      return "";
    }
    function isLookupishColumn(c) {
      const kind = String(c.kind || "").toLowerCase();
      return ["lookup", "customer", "owner", "uniqueidentifier", "guid"].includes(kind) ||
        /_value$/i.test(c.key || "") ||
        /customerid|parentcustomer/i.test(`${c.key || ""} ${c.logicalName || ""}`);
    }
    function dropAllEmptyLookupColumns(cols, rows) {
      if (!rows.length) return cols;
      return cols.filter(c => {
        if (!isLookupishColumn(c)) return true;
        return rows.some(row => {
          const resolved = resolveCellValue(row, c);
          const text = formatCell(c.key, resolved.value, resolved.kind || c.kind);
          return text && text !== "—";
        });
      });
    }
    function buildTableHtml(rows, structured) {
      const metaCols = normalizeMetadataColumns(structured);
      let cols = metaCols && metaCols.length ? metaCols : pickColumns(rows);
      cols = dropAllEmptyLookupColumns(cols, rows);
      if (!cols.length) return "";
      const ordered = prioritizeDisplayColumns(cols);
      const head = ordered.map(c => {
        const cls = columnClass(c, "");
        return `<th class="${cls}">${escapeHtml(c.label || niceHeader(c.key))}</th>`;
      }).join("");
      const body = rows.length
        ? rows.map(row => {
            const tds = ordered.map(c => {
              const resolved = resolveCellValue(row, c);
              const text = formatCell(c.key, resolved.value, resolved.kind || c.kind);
              const cls = columnClass(c, text);
              return `<td class="${cls}">${escapeHtml(text || "—")}</td>`;
            }).join("");
            return `<tr>${tds}</tr>`;
          }).join("")
        : `<tr><td class="col-empty" colspan="${ordered.length}">No records returned</td></tr>`;
      return `<div class="table-wrap" dir="ltr"><table class="crm-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    }
    function prioritizeDisplayColumns(cols) {
      const score = (c) => {
        const k = `${c.key || ""} ${c.logicalName || ""}`.toLowerCase();
        if (/^(name|fullname|subject)$/.test((c.logicalName || c.key || "").toLowerCase())) return 0;
        if (/ordernumber|accountnumber/.test(k)) return 1;
        if (/createdon|modifiedon/.test(k)) return 2;
        if (/status|state/.test(k)) return 3;
        if (/amount|total|price/.test(k)) return 4;
        if (/email|telephone|phone|job/.test(k)) return 5;
        if (/_value$|customer|parent/.test(k)) return 9;
        return 6;
      };
      return [...cols].sort((a, b) => score(a) - score(b));
    }
    function summaryFromReply(reply) {
      const lines = String(reply || "").split(/\r?\n/);
      return lines.filter(line => !/^\s*\d+\.\s+/.test(line)).join("\n").trim();
    }
    function addPlainMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role + " plain" + (hasArabic(text) ? " rtl" : "");
      if (hasArabic(text)) div.setAttribute("dir", "rtl");
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }
    function addAssistantResult(data) {
      const reply = data.reply || "";
      const structured = data.structuredData;
      const rows = extractRows(structured);
      const isCount = structured && (structured.operation === "count" || structured.count != null) && rows.length === 0;
      const ar = hasArabic(reply);
      const div = document.createElement("div");
      div.className = "msg assistant" + (ar ? " rtl" : "");
      if (ar) div.setAttribute("dir", "rtl");
      if (isCount && structured.count != null) {
        const capped = structured.countMayBeCapped ? (ar ? ` (على الأقل — قد يكون العدد أكبر)` : ` (at least — may be higher)`) : "";
        div.innerHTML =
          `<div class="count-badge">${ar ? "العدد" : "Count"}: ${escapeHtml(structured.count)}${capped}</div>` +
          `<div class="msg-meta-lines">${escapeHtml(summaryFromReply(reply))}</div>`;
      } else if (rows.length > 0 || (normalizeMetadataColumns(structured) && structured.operation === "list")) {
        const summary = summaryFromReply(reply);
        const summaryLines = summary.split("\n");
        const summaryDir = ar ? ' dir="rtl"' : "";
        div.classList.add("has-table");
        div.innerHTML =
          (summary
            ? `<p class="msg-summary"${summaryDir}>${escapeHtml(summaryLines[0] || summary)}</p>`
            : "") +
          buildTableHtml(rows, structured) +
          `<div class="msg-meta-lines"${summaryDir}>${escapeHtml(summaryLines.slice(1).join("\n"))}</div>`;
        div.classList.remove("rtl");
        div.removeAttribute("dir");
      } else {
        div.classList.add("plain");
        div.textContent = reply;
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    input.addEventListener("input", syncInputDirection);
    input.addEventListener("paste", () => setTimeout(syncInputDirection, 0));

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addPlainMessage("user", message);
      input.value = "";
      syncInputDirection();
      send.disabled = true;
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, conversationId })
        });
        const text = await res.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch { /* non-JSON */ }
        if (!res.ok) {
          const errEl = addPlainMessage("assistant", (data && (data.error || data.detail || data.title)) || text || "Request failed.");
          errEl.classList.add("error");
        } else {
          conversationId = data.conversationId;
          addAssistantResult(data);
          if (data.privacySafeToolExecution) {
            addPlainMessage("meta", "Privacy-safe: tool=" + (data.selectedTool || "?") +
              "; CRM→AI records=" + (data.outboundAiContainedCrmRecords ? "YES" : "NO") +
              (data.crmWhoAmIUserId ? ("; WhoAmI=" + data.crmWhoAmIUserId) : ""));
          }
        }
      } catch (err) {
        const errEl = addPlainMessage("assistant", "Network error: " + err.message);
        errEl.classList.add("error");
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    addPlainMessage("meta", "Conversation ready. Ask about accounts, contacts, leads, or sales orders.");
  </script>
</body>
</html>
